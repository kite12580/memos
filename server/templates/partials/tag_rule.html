<li class="mu-list-item grid gap-3 lg:grid-cols-[minmax(12rem,1fr)_auto_auto_auto] lg:items-center" data-rule="{{ r.tag }}" data-color="{{ r.color }}" data-blur="{{ r.blur }}">
<div class="min-w-0"><div class="flex min-w-0 items-center gap-2">{{ h::icon("tag", "mu-icon shrink-0 text-mu-text-secondary") }}<span class="truncate font-mono mu-body text-mu-text" data-rule-name="">{{ r.tag }}</span></div><div class="mt-1 flex flex-wrap items-center gap-2 pl-6 mu-caption text-mu-text-secondary"><span data-rule-count="">{{ c.t.n("setting.tags.used-count", r.count) }}</span></div></div>
<div class="flex items-center gap-2 mu-body text-mu-text-secondary"><span class="size-5 rounded-mu-md border border-mu-line{% if r.color.is_empty() %} bg-mu-canvas{% endif %}" style="background-color: {{ r.swatch() }};" aria-hidden="true" data-swatch=""></span><input type="color" class="size-8 cursor-pointer rounded-mu-md border border-mu-line bg-transparent p-0.5" value="{{ r.swatch() }}" aria-label="{{ c.t.s("setting.tags.background-color") }}" data-rule-color=""><button type="button"{% if r.color.is_empty() %} disabled data-disabled=""{% endif %} class="mu-button mu-button-ghost mu-base mu-s-md mu-focus" data-rule-clear=""><span class="mu-button-label">{% if r.color.is_empty() %}{{ c.t.s("setting.tags.default-color") }}{% else %}{{ r.color }}{% endif %}</span></button></div>
<div data-orientation="vertical" class="mu-field-root"><label class="mu-field-label mu-label"><span {% if r.blur %}data-checked=""{% else %}data-unchecked=""{% endif %} role="checkbox" tabindex="0" aria-checked="{{ r.blur }}" class="mu-checkbox mu-s-md mu-focus" data-rule-blur="">{% if r.blur %}<span data-checked="" class="mu-checkbox-indicator">{{ h::icon("check", "") }}</span>{% endif %}</span>{{ h::icon("eye-off", "mu-icon text-mu-text-secondary") }}{{ c.t.s("setting.tags.blur-content") }}</label></div>
<button type="button" class="mu-button mu-button-ghost mu-button-icon mu-base mu-s-xs mu-focus" aria-label="{{ c.t.s("common.delete") }}" data-rule-delete="">{{ h::icon("trash", "") }}</button>
</li>
