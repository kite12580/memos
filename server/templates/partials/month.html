<div class="flex flex-col gap-0.5">
<div class="group flex w-full flex-col text-mu-text-secondary">
<header class="min-w-0 items-center mu-s-md flex h-(--mu-row-height) w-full gap-1 rounded-(--mu-row-radius) px-2 mu-body group transition-colors mb-2 justify-between">
<h2 class="min-w-0 truncate mu-label text-mu-text select-none"><time data-fmt="month" datetime="{{ month.key }}">{{ month.title }}</time></h2>
<nav class="flex shrink-0 items-center gap-0.5" aria-label="{{ c.t.s("common.month-navigation") }}">
<button type="button" aria-label="{{ c.t.s("common.previous-month") }}" data-action="month" data-month="{{ month.prev }}" class="mu-button mu-button-ghost mu-button-icon mu-base mu-s-xs mu-focus">{{ h::icon("chevron-left", "rtl:rotate-180") }}</button>
<button type="button" aria-label="{{ c.t.s("common.next-month") }}" data-action="month" data-month="{{ month.next }}" class="mu-button mu-button-ghost mu-button-icon mu-base mu-s-xs mu-focus">{{ h::icon("chevron-right", "rtl:rotate-180") }}</button>
</nav>
</header>
<div class="w-full">
<div class="flex flex-col" role="group" aria-label="{{ month.aria }}">
<div class="mb-1 grid grid-cols-[repeat(7,28px)] justify-between gap-y-1" aria-hidden="true">
{%- for d in month.weekdays %}<div class="flex h-5 items-center justify-center mu-caption text-mu-text-secondary">{{ d }}</div>{% endfor %}
</div>
<div class="grid grid-cols-[repeat(7,28px)] justify-between gap-y-1">
{%- for d in month.days %}
{%- if d.in_month %}
<a href="{{ d.href }}" role="button" aria-label="{{ d.label }}{% if d.selected %} (selected){% endif %}"{% if d.today %} aria-current="date"{% endif %} class="group/day flex w-full items-center justify-center select-none p-0 focus-visible:outline-none cursor-pointer"><span class="relative flex aspect-square w-full max-w-7 items-center justify-center rounded-mu-md text-center mu-caption tabular-nums transition-[background-color,color,filter,box-shadow] duration-150 ease-out {{ d.fill }} group-hover/day:brightness-[0.97] group-focus-visible/day:outline-2 group-focus-visible/day:outline-solid group-focus-visible/day:-outline-offset-2 group-focus-visible/day:outline-mu-focus">{{ d.day }}{% if d.today %}<span aria-hidden="true" class="absolute bottom-[3px] left-1/2 size-[3px] -translate-x-1/2 rounded-full bg-current opacity-70"></span>{% endif %}</span></a>
{%- else %}
<div class="group/day flex w-full items-center justify-center select-none cursor-default"><span class="relative flex aspect-square w-full max-w-7 items-center justify-center rounded-mu-md text-center mu-caption tabular-nums transition-[background-color,color,filter,box-shadow] duration-150 ease-out bg-transparent text-mu-text-secondary/25">{{ d.day }}</span></div>
{%- endif %}
{%- endfor %}
</div>
</div>
</div>
</div>
</div>
