<div role="dialog" aria-labelledby="day-panel-title" data-day-panel="{{ panel.date }}" class="fixed z-30 flex min-h-0 flex-col border border-mu-line/70 bg-mu-surface text-mu-text outline-none transition-transform duration-200 inset-y-3 end-3 w-[var(--memo-panel-width)] rounded-mu-xl data-starting-style:translate-x-full data-ending-style:translate-x-full max-md:hidden">
<div class="absolute inset-y-0 start-0 w-0"><div role="separator" aria-orientation="vertical" aria-label="{{ c.t.s("common.resize-panel") }}" aria-valuenow="{{ c.prefs.panel_width }}" aria-valuemin="320" aria-valuemax="640" tabindex="0" data-resize="panel" class="group absolute inset-y-0 z-10 flex w-2 cursor-col-resize touch-none items-center justify-center focus-visible:outline-none -start-1"><div class="h-8 w-1 rounded-full transition-[background-color,opacity] duration-150 bg-mu-text-secondary/50 opacity-0 group-hover:opacity-100 group-focus-visible:bg-mu-primary/70 group-focus-visible:opacity-100"></div></div></div>
<header class="flex shrink-0 items-center gap-0.5 border-b border-mu-line/70 py-2.5 ps-3 pe-3"><div class="min-w-0 flex-1"><h2 id="day-panel-title" class="truncate mu-title text-mu-text"><time data-fmt="day" datetime="{{ panel.date }}">{{ panel.label }}</time></h2></div><a href="{{ panel.close_href }}" data-close-day="" aria-label="{{ c.t.s("common.close") }}" class="mu-button mu-button-ghost mu-button-icon mu-base mu-s-sm mu-focus">{{ h::icon("x", "") }}</a></header>
<div tabindex="-1" class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-4 outline-none" data-day-cards="">
{%- for m in panel.cards %}
{% include "partials/card.html" %}
{%- endfor %}
<button type="button" data-day-compose="" class="mu-button mu-button-ghost mu-base mu-s-sm mu-focus self-start">{{ h::icon("plus", "mu-icon") }}<span class="mu-button-label">{{ c.t.s("calendar.new-memo-on-day") }}</span></button>
<div data-day-composer="" hidden>{% let composer = panel.composer %}{% include "partials/composer.html" %}</div>
</div>
</div>
