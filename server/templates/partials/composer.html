<div class="group w-full flex flex-col justify-between items-start gap-2 relative bg-mu-surface px-4 pt-3 pb-4 rounded-mu-lg border border-mu-line/70 mb-2" data-composer="{{ composer.mode }}"{% if !composer.parent.is_empty() %} data-parent="{{ composer.parent }}"{% endif %} id="compose">
<div class="relative w-full flex flex-col flex-1">
<div class="relative flex w-full flex-col items-start justify-start bg-inherit memo-editor-content">
<div class="memo-editor-scroller w-full text-base leading-6">
<div class="memo-editor-root mbe-root" role="textbox" aria-multiline="true" spellcheck="true" translate="no" aria-placeholder="{{ composer.placeholder }}" contenteditable="true" data-draft="" style="--mbe-placeholder: &quot;{{ composer.placeholder }}&quot;;"><p dir="auto" class="mbe-empty-content mbe-block mbe-paragraph mbe-empty"><br></p></div>
</div>
</div>
</div>
<div class="w-full flex flex-col gap-2" data-composer-extras=""></div>
<div class="mu-compact flex w-full min-w-0 flex-row items-center justify-between gap-1">
<div class="flex min-w-0 flex-1 flex-row items-center justify-start gap-1">
<button type="button" aria-label="{{ c.t.s("common.add") }}" aria-haspopup="menu" aria-expanded="false" data-popup="insert-menu" class="mu-button mu-button-neutral mu-button-icon mu-base mu-s-md mu-focus mu-menu-trigger">{{ h::icon("plus", "") }}</button>
</div>
<div class="flex shrink-0 flex-row items-center justify-end gap-1">
<button type="button" data-action="save" data-disabled="" aria-disabled="true" aria-keyshortcuts="Meta+Enter Control+Enter" class="mu-button mu-button-primary mu-base mu-s-md mu-focus"><span class="mu-button-label">{{ composer.save_label }}</span></button>
<span class="mu-visually-hidden">{{ c.t.s("editor.validation.content-required") }}</span>
</div>
</div>
</div>
