[package]
name = "memos-lite"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ammonia = "4.2.5"
askama = "0.16.1"
bytes = "1.12.2"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "server", "server-graceful"] }
intl_pluralrules = "7.0.2"
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
regex-lite = "0.1.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
unic-langid = "0.9.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
serde_json = "1.0.154"
